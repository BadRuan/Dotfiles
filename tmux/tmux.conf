# ============================
# 基础设置
# ============================

# 终端颜色支持
set -g default-terminal "tmux-256color"
set -as terminal-overrides ",xterm-256color:RGB"

# 去掉 Escape 延迟，Vim/Neovim 体验更好
set -sg escape-time 0

# 快捷键重复响应更快
set -g repeat-time 300

# 开启鼠标：滚轮滚动、点击切换窗格、拖拽调整大小
set -g mouse on

# 加大历史回滚行数，看日志更舒服
set -g history-limit 50000

# 窗口和窗格编号从 1 开始
set -g base-index 1
set -g pane-base-index 1

# 关闭窗口后自动重排编号
set -g renumber-windows on

# ============================
# 重载配置
# ============================

# Prefix + r 重载配置
bind r source-file ~/.tmux.conf \; display-message "Config reloaded!"

# ============================
# 窗口与窗格
# ============================

# 更直观的分屏快捷键
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# 新建窗口时继承当前目录
bind c new-window -c "#{pane_current_path}"

# Vim 风格切换窗格，-r 表示长按可连续移动
bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R

# 调整窗格大小
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# ============================
# 复制模式
# ============================

# 复制模式使用 vi 风格
setw -g mode-keys vi

# v 开始选择，y 复制并退出
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# ============================
# 插件列表（TPM）
# ============================

set -g @plugin 'catppuccin/tmux'
set -g @plugin 'tmux-plugins/tmux-cpu'      # CPU 状态栏模块依赖
set -g @plugin 'tmux-plugins/tmux-battery'  # 电池状态栏模块依赖
set -g @plugin 'tmux-plugins/tmux-yank'     # 复制内容进系统剪贴板

# ============================
# Catppuccin 主题配置
# ============================

# 配色：latte（浅色）/ frappe / macchiato / mocha（最深）
set -g @catppuccin_flavor 'mocha'

# 窗口标签样式：rounded（圆角）/ slanted（斜切）/ none
set -g @catppuccin_window_status_style "rounded"

# 窗口编号在左，编号底色填充
set -g @catppuccin_window_number_position "left"
set -g @catppuccin_window_default_fill "number"
set -g @catppuccin_window_current_fill "number"

# 窗口显示名称；当前窗口若最大化则追加 (Z) 标记
set -g @catppuccin_window_default_text "#W"
set -g @catppuccin_window_current_text "#W#{?window_zoomed_flag,(Z),}"

# 状态栏模块只有图标着色，风格更轻盈
set -g @catppuccin_status_fill "icon"
set -g @catppuccin_status_connect_separator "no"

# 日期时间格式
set -g @catppuccin_date_time_text "%Y-%m-%d %H:%M"

# ============================
# 状态栏（Catppuccin 模块）
# ============================

set -g status-position bottom
set -g status-interval 5
set -g status-left-length 100
set -g status-right-length 100

# 左侧：会话名
set -g status-left "#{E:@catppuccin_status_session}"

# 右侧：当前程序 | CPU | 会话 | 电池 | 日期时间
set -g status-right "#{E:@catppuccin_status_application}"
set -agF status-right "#{E:@catppuccin_status_cpu}"
set -ag status-right "#{E:@catppuccin_status_session}"
set -agF status-right "#{E:@catppuccin_status_battery}"
set -ag status-right "#{E:@catppuccin_status_date_time}"

# ============================
# 初始化 TPM（必须保持最后一行）
# ============================

run '~/.tmux/plugins/tpm/tpm'
